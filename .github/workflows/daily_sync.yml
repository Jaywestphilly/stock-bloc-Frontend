name: Hourly Stock Bloc Backend Data Feed Synchronizer

on:
  schedule:
    - cron: '0 * * * *' # Runs hourly at top of the hour
  workflow_dispatch: # Allows manual trigger
  push:
    branches:
      - main

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Execute Node Market Data Service Refresh & Validate
        run: |
          npm run refresh:market
          npm run validate:market
        env:
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}

      - name: Execute Data Fetchers (Market, SEC 13F, Dyson Swarm, Intel News)
        id: fetch_feeds
        run: |
          chmod +x scripts/*.py
          python3 scripts/fetch_market.py
          python3 scripts/fetch_sec.py
          python3 scripts/fetch_dyson.py
          python3 scripts/fetch_intel_feed.py

      - name: Rigorous Feed Verification & Timestamp Advancement
        id: verify_feeds
        run: |
          python3 scripts/verify_and_update_feeds.py

      - name: Commit and Push Updated Feeds
        if: success()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add market_watchlist_data.json sec_intel_data.json dyson_swarm_data.json intel_news_feed.json public/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(sync): automated hourly feed update & timestamp advancement" && git push)

      - name: Open Failure Issue if Sync Fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 CRITICAL: Stock Bloc Backend Feed Sync Failed Loudly',
              body: 'The automated feed update or verification step failed or produced an empty array / missing updated_at. Review GitHub Actions workflow logs immediately.',
              labels: ['bug', 'critical', 'backend-sync']
            });
