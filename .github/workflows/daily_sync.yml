name: Hourly Stock Bloc Backend Data Feed Synchronizer

on:
  schedule:
    - cron: '0 * * * *' # Runs hourly at top of the hour
  workflow_dispatch: # Allows manual trigger
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/daily_sync.yml'

concurrency:
  group: stock-bloc-sync
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Execute Node Market Data Service Refresh & Validate
        continue-on-error: true
        run: |
          npm run refresh:market || true
          npm run validate:market || true
        env:
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Execute Data Fetchers (Market, SEC 13F, Dyson Swarm, Intel News)
        id: fetch_feeds
        run: |
          chmod +x scripts/*.py
          python3 scripts/fetch_market.py
          python3 scripts/fetch_sec.py
          python3 scripts/fetch_dyson.py
          python3 scripts/fetch_intel_feed.py

      - name: Rigorous Feed Verification & Timestamp Advancement
        id: verify_feeds
        run: |
          python3 scripts/verify_and_update_feeds.py

      - name: Commit and Push Updated Feeds
        if: success()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add market_watchlist_data.json sec_intel_data.json dyson_swarm_data.json intel_news_feed.json public/
          if git diff --staged --quiet; then
            echo "No data changes detected to commit."
          else
            git commit -m "chore(sync): automated hourly feed update & timestamp advancement [skip ci]"
            git pull --rebase origin main || true
            git push origin main || echo "Git push skipped or permissions restricted in fork."
          fi
