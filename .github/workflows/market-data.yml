name: Stock Bloc Market Data Pipeline Automation

on:
  schedule:
    # Runs every 15 minutes during US market trading hours (13:00 - 21:00 UTC, Mon-Fri)
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

concurrency:
  group: stock-bloc-market-data
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  refresh-and-validate:
    name: Refresh and Validate Market Watchlist Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Refresh Live Market Watchlist Feed
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run refresh:market

      - name: Validate Watchlist Schema and Quant Signal Metrics
        run: npm run validate:market

      - name: Commit and Push Updated Market Datasets
        if: success()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add market_watchlist_data.json public/market_watchlist_data.json
          if git diff --staged --quiet; then
            echo "No market price or signal changes detected."
          else
            git commit -m "chore(data): automated market watchlist refresh and quant signal validation [skip ci]"
            git pull --rebase origin main || true
            git push origin main || echo "Git push skipped or permissions restricted in fork/branch."
          fi
